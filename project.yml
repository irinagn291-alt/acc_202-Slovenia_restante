name: Restante
packages:
  Alamofire:
    url: https://github.com/wrandecima-bit/Alamofire
    revision: 7fdd403089757be2ce6991b287c7bef612c8bd04
options:
  bundleIdPrefix: com.restante
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Restante:
    type: application
    platform: iOS
    sources:
      - path: Restante
    resources:
      - path: PrivacyInfo.xcprivacy
    dependencies:
      - package: Alamofire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.restante.hold
        PRODUCT_NAME: Restante
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Restante
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_UIColorName: background
        INFOPLIST_KEY_UILaunchScreen_UIImageName: rst_Splash
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_NSCameraUsageDescription: This app does not use the camera.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
  RestanteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RestanteTests
    dependencies:
      - target: Restante
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.restante.hold.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Restante.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Restante"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
  RestanteShotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RestanteShotTests
    dependencies:
      - target: Restante
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.restante.hold.tests.shots
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Restante.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Restante"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
schemes:
  Restante:
    build:
      targets:
        Restante: all
        RestanteTests: [test]
    test:
      targets:
        - RestanteTests
  RestanteShots:
    build:
      targets:
        Restante: all
        RestanteShotTests: [test]
    test:
      targets:
        - RestanteShotTests
